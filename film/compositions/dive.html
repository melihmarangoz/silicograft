<template>
  <style>
    /* The website's font (site/tokens.css), for the cell-type labels (pass 4). */
    @font-face {
      font-family: "Mona Sans";
      src: url("assets/fonts/MonaSans-latin-var.woff2") format("woff2");
      font-weight: 200 900;
      font-stretch: 75% 125%;
      font-style: normal;
      font-display: block;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #02071d;
    }
    #dive-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Cell-type labels (pass 4): drawn by the engine every frame (assets/js/labels.js). */
    #dive-labels {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    #dive-labels .sg-halo {
      fill: none;
      stroke: #02071d;
      stroke-opacity: 0.4;
      stroke-width: 4.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #dive-labels .sg-line {
      fill: none;
      stroke: #e7f0f9;
      stroke-opacity: 0.7;
      stroke-width: 1.75px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #dive-labels .sg-dot {
      fill: #e7f0f9;
      stroke: #02071d;
      stroke-opacity: 0.6;
      stroke-width: 1.5px;
    }
    #dive-labels .sg-text {
      font-family: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 28px;
      font-weight: 500;
      font-stretch: 100%;
      letter-spacing: 0.005em;
      fill: #e7f0f9;
      stroke: #02071d;
      stroke-opacity: 0.55;
      stroke-width: 6px;
      stroke-linejoin: round;
      paint-order: stroke fill;
      dominant-baseline: central;
    }
  </style>
  <div id="root" data-composition-id="dive" data-start="0" data-duration="52" data-width="1920" data-height="1080">
    <canvas
      id="dive-canvas"
      class="clip"
      data-start="0"
      data-duration="52"
      data-track-index="1"
      width="1920"
      height="1080"
      data-layout-allow-overflow
    ></canvas>
    <!-- Cell-type labels (pass 4): five slots, filled by the engine from the beats' ctx.labels. -->
    <svg
      id="dive-labels"
      class="clip"
      data-start="0"
      data-duration="52"
      data-track-index="2"
      width="1920"
      height="1080"
      viewBox="0 0 1920 1080"
      aria-hidden="true"
      data-layout-allow-overflow
      data-layout-allow-overlap
    >
      <g class="sg-label" opacity="0"><path class="sg-halo" d="M0 0" /><path class="sg-line" d="M0 0" /><circle class="sg-dot" cx="0" cy="0" r="3.5" /><text class="sg-text" x="0" y="0"></text></g>
      <g class="sg-label" opacity="0"><path class="sg-halo" d="M0 0" /><path class="sg-line" d="M0 0" /><circle class="sg-dot" cx="0" cy="0" r="3.5" /><text class="sg-text" x="0" y="0"></text></g>
      <g class="sg-label" opacity="0"><path class="sg-halo" d="M0 0" /><path class="sg-line" d="M0 0" /><circle class="sg-dot" cx="0" cy="0" r="3.5" /><text class="sg-text" x="0" y="0"></text></g>
      <g class="sg-label" opacity="0"><path class="sg-halo" d="M0 0" /><path class="sg-line" d="M0 0" /><circle class="sg-dot" cx="0" cy="0" r="3.5" /><text class="sg-text" x="0" y="0"></text></g>
      <g class="sg-label" opacity="0"><path class="sg-halo" d="M0 0" /><path class="sg-line" d="M0 0" /><circle class="sg-dot" cx="0" cy="0" r="3.5" /><text class="sg-text" x="0" y="0"></text></g>
    </svg>
  </div>
  <script>
    // Host for the film engine (assets/js/engine.js). The whole picture is drawn by
    // engine.render(t) from the hf-seek time alone; the GSAP timeline below only
    // gives the composition its 52 s duration.
    (function () {
      var DURATION = 52; // the film (pass 3, SPEC P3-1; assets/js/timeline.js DURATION)
      var host = (window.__sgDive = window.__sgDive || {});
      host.t = 0;
      host.render = null;
      host.ready = new Promise(function (resolve, reject) {
        host.resolve = resolve;
        host.reject = reject;
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["dive"] = host.ready;

      // Draw each time once, whichever of hf-seek and the timeline's onUpdate comes first
      // (the canvas keeps its pixels: preserveDrawingBuffer).
      host.lastDrawn = NaN;
      host.draw = function (t) {
        host.t = t;
        if (!host.render || t === host.lastDrawn) return;
        host.render(t);
        host.lastDrawn = t;
      };
      window.addEventListener("hf-seek", function (e) {
        host.draw(e.detail.time);
      });

      var clock = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(
        clock,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            // Studio scrubbing seeks the timeline; draw from it too (pure function of t).
            host.draw(clock.t);
          },
        },
        0,
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["dive"] = tl;
    })();
  </script>
  <script type="module">
    const host = window.__sgDive;
    const base = document.baseURI;
    import(new URL("assets/js/engine.js", base).href)
      .then((m) =>
        m.boot({ canvas: document.getElementById("dive-canvas"), labels: document.getElementById("dive-labels"), baseURL: base }),
      )
      .then((engine) => {
        host.engine = engine;
        host.render = (t) => engine.render(t);
        host.lastDrawn = NaN;
        host.draw(host.t);
        host.resolve();
      })
      .catch((err) => {
        console.error("[dive] engine failed to build", err);
        host.reject(err);
      });
  </script>
</template>
